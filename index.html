<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cab-Link — Brooklyn Bus Delay &amp; Cab Dispatch Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 20.5 L14 11 L18 16 L25 8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='8' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --border: #dfe3e8;
    --text: #1c2530;
    --muted: #63707e;
    --accent: #0b6cb7;
    --shadow: 0 2px 12px rgba(16, 24, 40, .12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    overflow: hidden;
    display: flex;
  }
  #map { flex: 1 1 auto; height: 100%; background: #e8ebf0; }

  /* ---------- sidebar ----------
     The panel sits beside the map rather than over it, so fitBounds gets the
     true usable width and routes never hide behind it. */
  /* Above 1000 so Leaflet's own controls don't paint over the panel when it
     overlays the map on narrow screens. */
  /* overflow-y:auto is a safety net, not the primary scroll mechanism: on a
     normal-height viewport #routes below does all the scrolling and this
     never engages. But #routes can only shrink so far (flex-shrink stops at
     its min-height), and body has overflow:hidden -- without this, a
     viewport too short for everything below #routes to fit (alerts section,
     fleet toggle, demo buttons, footer) would silently clip them off the
     bottom with no way to reach them at all, rather than showing a
     scrollbar. Caught when the key-finding panel below pushed total content
     height past a 1440x800 window and the fleet/demo/footer controls
     vanished with no visible scrollbar. */
  #panel {
    flex: 0 0 320px; width: 320px; z-index: 1200;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; box-shadow: var(--shadow);
    transition: margin-left .22s ease; overflow-y: auto;
  }
  #panel.collapsed { margin-left: -320px; }

  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
  header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
  header .tagline { margin: 3px 0 0; font-size: 12.5px; color: var(--text); font-weight: 550; }
  header .meta { margin: 5px 0 0; font-size: 11.5px; color: var(--muted); }

  /* ---------- key finding ----------
     The thesis result itself -- otherwise the panel opens straight into
     mechanism (checkboxes, sliders) with no framing of why any of it
     matters. The number is pulled directly from
     models/test_demand_hypothesis.py's output (any_severe, lag+0h), not
     derived from anything threaded through this page's own build/
     placeholders.

     Deliberately pared down to just this one stat for now -- an earlier
     version also showed the matched street-hail comparison plus a
     collapsible methodology/caveats section (see web/README.md's "Key
     finding panel" history for that fuller version and why it went through
     a couple of rounds getting its default size down to something that
     didn't push the route list and alert controls below it off the bottom
     of the panel). Cut back to one line by request; nothing below depends
     on the removed markup, so no leftover toggle/detail plumbing here. */
  .finding {
    padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .findinghead { font-size: 13px; margin-bottom: 6px; }
  .findingstat { display: flex; align-items: baseline; gap: 8px; }
  .fnum {
    flex: none; min-width: 52px; text-align: right; font-size: 15px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .fnum.up { color: #1a8f5c; }
  .flabel { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
  .flabel b { color: var(--text); font-weight: 640; }

  .controls { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
  #search {
    width: 100%; padding: 7px 10px; font: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .btnrow { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  button.mini {
    font: inherit; font-size: 12px; padding: 5px 9px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  button.mini:hover { background: #eef1f5; border-color: #c4ccd6; }
  .count {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ---------- route list ---------- */
  /* flex:1 1 130px + min-height:130px: this is the one flexible region in
     the panel, so it absorbs whatever space the fixed sections above/below
     it don't use -- on a normal-height viewport it just grows to fill the
     panel. The 130px floor keeps a handful of route rows visible even when
     the panel is short enough that #panel's own overflow-y:auto (above)
     has to take over for everything below this list; without a floor, flex
     would shrink this all the way to 0 and show no routes at all before
     the fallback scroll kicks in. */
  #routes { flex: 1 1 130px; min-height: 130px; overflow-y: auto; padding: 6px 8px 12px; }
  .route {
    display: flex; align-items: center; gap: 9px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; user-select: none;
  }
  .route:hover { background: #e9edf2; }
  .route.off .badge, .route.off .name { opacity: .38; }
  .route input { margin: 0; flex: none; cursor: pointer; accent-color: var(--accent); }
  .badge {
    flex: none; min-width: 42px; text-align: center; padding: 2px 6px; border-radius: 4px;
    font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .01em;
  }
  .name { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zoom {
    flex: none; margin-left: auto; opacity: 0; border: 0; background: none; cursor: pointer;
    color: var(--accent); font-size: 11px; font-weight: 600; padding: 2px 4px;
  }
  .route:hover .zoom { opacity: 1; }

  /* ---------- alert layer ---------- */
  #alerts { border-top: 1px solid var(--border); background: var(--bg); padding: 11px 16px 13px; }
  .alerthead {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 13px; user-select: none;
  }
  .alerthead input { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 5px;
    border-radius: 3px; background: #eef1f5; color: var(--muted); vertical-align: 1px;
  }
  #alertsummary { margin: 6px 0 8px; font-size: 11px; color: var(--muted); }
  .budget { margin-top: 9px; }
  .budgetrow {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 11px; color: var(--muted);
  }
  .budgetrow output {
    font-weight: 700; color: var(--text); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #budget { width: 100%; margin: 5px 0 3px; accent-color: var(--accent); cursor: pointer; }
  .budgetnote { font-size: 10.5px; color: var(--muted); line-height: 1.35; }
  #alerts.off .budget { opacity: .4; pointer-events: none; }
  /* Marker colours cannot follow the route lines here: MTA gives B35 and B6
     the same red, so matching them would make two of the three routes
     indistinguishable. The key spells out the substitute palette. */
  .alertkey { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; font-size: 11px; color: var(--muted); }
  .alertkey i { width: 9px; height: 9px; border-radius: 50%; display: inline-block;
                border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--border); margin-right: 4px; vertical-align: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .chip {
    font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--text);
  }
  .chip:hover { background: #f2f5f8; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.mini.wide { width: 100%; }
  /* #isolate deliberately NOT included here: it's a route-visibility filter
     (which of the 55 routes are shown), not a property of the alert-marker
     layer, so it stays usable whether Delay alerts is checked or not. The
     budget/chips/summary above it ARE properties of that layer -- dimming
     them when it's off is correct, since there's nothing for them to control. */
  #alerts.off .chips, #alerts.off #alertsummary { opacity: .4; pointer-events: none; }
  .alertpop .r { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .alertpop b { font-weight: 640; }
  .alertpop .cabsec { margin-top: 8px; }
  .alertpop .cabnote {
    font-size: 10.5px; color: var(--muted); font-style: italic; margin-bottom: 4px;
  }
  .alertpop .cablist { list-style: none; margin: 0 0 7px; padding: 0; }
  .alertpop .cablist li {
    display: flex; justify-content: space-between; font-size: 12px;
    color: var(--text); padding: 2px 0;
  }
  .alertpop .cablist .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .alertpop .cabbtn { width: 100%; }
  .cabtip {
    background: #1c2530; color: #fff; border: 0; border-radius: 5px;
    font-size: 11px; padding: 3px 7px; font-weight: 600;
  }
  .cabtip::before { border-top-color: #1c2530 !important; }

  .fleethead {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 13px; user-select: none; margin-top: 11px;
  }
  .fleethead input { margin: 0; cursor: pointer; accent-color: var(--accent); }

  /* className:'taxi-icon' on the divIcon replaces Leaflet's default
     'leaflet-div-icon' class entirely (rather than adding to it), so
     leaflet.css's white-box-plus-border default icon styling never
     applies -- this rule is a defensive no-op today, kept in case a future
     Leaflet upgrade changes that default. */
  .taxi-icon { background: none; border: none; }

  /* ---------- live-alert demo trigger ----------
     A presenter control, not a data control -- styled to read as a utility
     button (dashed border, no fill) rather than sitting alongside the real
     toggles above it, so it's never mistaken for another real data layer. */
  .demorow { margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--border); display: flex; gap: 6px; }
  .demorow .mini { flex: 1 1 0; }
  .demobtn { border-style: dashed; color: var(--muted); }
  .demobtn:hover { color: var(--text); }

  /* ---------- live-alert toast ----------
     Fixed position, independent of the Leaflet panes entirely -- this is
     plain page chrome, not a map layer, so it can't collide with anything
     the pane-click-blocking bug touched.

     Centered on screen and sized up (was a small bottom-right corner toast)
     so it reads as the main focus during a live demo rather than a
     peripheral notification -- z-index 3000 already put it above
     everything else (panel 1200, toggle 1201, Leaflet's own controls/
     popups), centering is what actually makes that true visually. The
     entrance animation keeps the same "settle in from slightly below"
     motion as the old corner toast, just composed with the centering
     transform instead of replacing it: translate(-50%, -50%) is the
     centering, the extra translateY(16px) in the hidden state is the
     slide-in offset, so .show only has to change the Y component. */
  .livetoast {
    position: fixed; top: 50%; left: 50%; z-index: 3000;
    width: min(460px, calc(100vw - 32px));
    background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    border-left: 6px solid #d03b3b; padding: 22px 26px;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    transform: translate(-50%, -50%) translateY(16px); opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
  }
  .livetoast.show { transform: translate(-50%, -50%) translateY(0); opacity: 1; }
  .lt-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .lt-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #d03b3b; flex: none;
    animation: lt-pulse 1.4s ease-in-out infinite;
  }
  @keyframes lt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .lt-label {
    font-size: 13px; font-weight: 700; letter-spacing: .04em; color: #d03b3b;
    text-transform: uppercase;
  }
  .lt-label .tag { margin-left: 4px; text-transform: none; letter-spacing: 0; }
  .lt-close {
    margin-left: auto; border: 0; background: none; cursor: pointer; font-size: 24px;
    color: var(--muted); line-height: 1; padding: 0 2px;
  }
  .livetoast .badge { font-size: 14px; min-width: 48px; padding: 3px 8px; }
  .lt-body b { display: block; margin: 6px 0 0; font-size: 19px; }
  .lt-zone { color: var(--muted); font-size: 14px; }
  .lt-risk { color: var(--text); font-size: 16px; margin-top: 10px; font-weight: 600; }
  .livetoast .lt-view { width: 100%; margin-top: 16px; font-size: 15px; padding: 11px 14px; }

  footer { border-top: 1px solid var(--border); padding: 9px 16px 12px; font-size: 11px; color: var(--muted); }
  footer a { color: var(--accent); }

  /* ---------- toggle ---------- */
  #toggle {
    position: fixed; top: 12px; left: 332px; z-index: 1201;
    width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--border);
    background: #fff; box-shadow: var(--shadow); cursor: pointer; color: var(--text);
    font-size: 16px; line-height: 1; transition: left .22s ease;
  }
  #panel.collapsed ~ #toggle { left: 12px; }

  /* ---------- popup / tooltip ---------- */
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pop-head .badge { font-size: 13px; min-width: 46px; padding: 3px 7px; }
  .pop-name { font-weight: 640; font-size: 13.5px; }
  .pop-row { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .pop-row b { color: var(--text); font-weight: 600; }
  .rt-tip { font-weight: 650; font-size: 12px; }

  /* Below this width there isn't room for both, so the panel goes back to
     floating over the map and the toggle moves clear of the layer control. */
  @media (max-width: 720px) {
    #panel {
      position: fixed; top: 0; left: 0; bottom: 0; margin-left: 0;
      width: 84vw; max-width: 320px; flex-basis: 84vw;
      transition: transform .22s ease;
    }
    #panel.collapsed { margin-left: 0; transform: translateX(-100%); }
    #map { flex: 1 1 100%; }
    #toggle { left: auto; right: 12px; top: 58px; }
    #panel.collapsed ~ #toggle { left: auto; right: 12px; }
  }
</style>
</head>
<body>

<aside id="panel">
  <header>
    <h1>Cab-Link</h1>
    <p class="tagline">Where Brooklyn bus delays send riders next</p>
    <p class="meta">55 routes · MTA GTFS, May 2023</p>
  </header>

  <div class="finding">
    <div class="findinghead"><b>Key finding</b> <span class="tag">2023 pilot</span></div>
    <div class="findingstat">
      <span class="fnum up">1.03&times;</span>
      <span class="flabel"><b>FHV</b> (Uber/Lyft/Via) pickups after a severe bus delay &mdash; significant</span>
    </div>
  </div>

  <div class="controls">
    <input id="search" type="search" placeholder="Filter routes (e.g. B41, Flatbush)" autocomplete="off">
    <div class="btnrow">
      <button class="mini" id="all" title="Show all listed routes">All</button>
      <button class="mini" id="none" title="Hide all listed routes">None</button>
      <button class="mini" id="reset" title="Zoom back out to all of Brooklyn">Reset view</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="routes"></div>

  <div id="alerts">
    <label class="alerthead">
      <input type="checkbox" id="alerttoggle">
      <span><b>Delay alerts</b> <span class="tag" id="alerttag">2024 backtest</span></span>
    </label>

    <div class="budget">
      <div class="budgetrow">
        <label for="budget">Alert budget</label>
        <output id="budgetval"></output>
      </div>
      <input type="range" id="budget" min="0" max="0" step="1" value="0">
      <div class="budgetnote" id="budgetnote"></div>
    </div>

    <p class="hint" id="alertsummary"></p>
    <div class="alertkey" id="alertkey"></div>
    <div class="chips" id="bands"></div>
    <button class="mini wide" id="isolate" title="Hide every route the model does not cover">
      Show only alert routes
    </button>

    <label class="fleethead">
      <input type="checkbox" id="fleettoggle">
      <span><b>Simulated cab fleet</b> <span class="tag">synthetic</span></span>
    </label>

    <div class="demorow">
      <button class="mini demobtn" id="resetdemo"
        title="Restore the panel and map to their default state, for repeated run-throughs">
        Reset demo
      </button>
      <button class="mini demobtn" id="simulatelive"
        title="Replay a real 2024 alert as a live push notification (or press L)">
        Simulate live alert <span class="tag">demo</span>
      </button>
    </div>
  </div>

  <footer>
    Geometry from <code>shapes.txt</code>, longest alignment per direction.
    Source: <a href="https://web.archive.org/web/20230528055805/http://web.mta.info/developers/data/nyct/bus/google_transit_brooklyn.zip" target="_blank" rel="noopener">MTA feed, 2023-05-28</a>.
  </footer>
</aside>

<div id="map"></div>

<button id="toggle" title="Toggle panel">&#9776;</button>

/* ---------------- map ---------------- */
/* zoomSnap 0.25: Brooklyn's extent is a shade too wide for integer zoom 12, and
   without fractional snapping fitBounds drops a whole step to 11 and leaves the
   borough as a small blob. preferCanvas keeps 218 polylines smooth when panning. */
/* zoomControl:false + added manually at bottomleft: Leaflet's default top-left
   position sits right where the panel-toggle button lives (#toggle at
   left:332px/top:12px, essentially the map's own top-left corner), so the two
   controls rendered on top of each other. Stacks cleanly above the scale bar
   instead, which already lives at bottomleft with nothing else there. */
const map = L.map('map', { zoomControl: false, preferCanvas: true, zoomSnap: 0.25, zoomDelta: 1 });
L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.control.scale({ imperial: true, metric: false, position: 'bottomleft' }).addTo(map);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Routes: MTA NYCT GTFS 2023'
});

const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, subdomains: 'abcd',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a> | Routes: MTA NYCT GTFS 2023'
});

/* CARTO is the default, not tile.openstreetmap.org. The OSM tile host is a
   common casualty of ad blockers, DNS-level filters (Pi-hole and similar),
   and corporate proxies -- it enforces a strict usage policy and shows up on
   several public blocklists as a result. That is silent to this page: tiles
   just never arrive, and a first-time viewer has no way to know a working
   alternative exists one click away in the layer switcher.

   The listener below makes that recovery automatic. It only fires for the
   layer currently on the map, counts real failures (not the handful of
   edge-of-world tiles above zoom that legitimately 404), and switches once --
   never bounces back, so a viewer whose network blocks the *other* host isn't
   pinged back and forth. */
light.addTo(map);

function attachAutoFallback(primary, fallback, primaryName, fallbackName) {
  let failures = 0, switched = false;
  primary.on('tileerror', () => {
    if (switched || !map.hasLayer(primary)) return;
    if (++failures < 6) return;
    switched = true;
    map.removeLayer(primary);
    fallback.addTo(map);
    console.warn(`${primaryName} tiles failed to load (blocked by an ad blocker, `
      + `DNS filter, or network policy) -- switched to ${fallbackName}.`);
  });
}
attachAutoFallback(light, osm, 'CARTO', 'OpenStreetMap');
attachAutoFallback(osm, light, 'OpenStreetMap', 'CARTO');

L.control.layers({ 'Light (CARTO)': light, 'OpenStreetMap': osm }, null, { position: 'topright' }).addTo(map);

/* ---------------- group features by route ---------------- */
/* B6 renders green instead of MTA's official red (#EE352E) -- shared with
   ~13 other Brooklyn routes, B35 included, which is also why the alert
   layer further down needs its own substitute ROUTE_COLOR palette instead
   of reusing route colors directly (B35/B6 would be identical alert
   markers otherwise). Deliberately the SAME green ROUTE_COLOR already uses
   for B6 (#1baf7a), not a different green, so the route line and B6's own
   alert markers/badges read as one consistent color rather than two
   different greens for the same route. Mutates route_color/route_text_color
   on the parsed feature properties only -- this page's own rendering, not
   the underlying GTFS value (which nothing here re-exports or persists). */
const ROUTE_COLOR_OVERRIDE = { 'B6': { route_color: '#1baf7a', route_text_color: '#ffffff' } };

const routes = new Map();          // route_id -> {meta, features[]}
for (const f of DATA.features) {
  const p = f.properties;
  Object.assign(p, ROUTE_COLOR_OVERRIDE[p.route_id]);
  if (!routes.has(p.route_id)) routes.set(p.route_id, { meta: p, features: [] });
  routes.get(p.route_id).features.push(f);
}

// B1, B2, ... B84 -- sort numerically so B9 precedes B11, SBS variants last.
const order = [...routes.keys()].sort((a, b) => {
  const na = parseInt(a.slice(1), 10), nb = parseInt(b.slice(1), 10);
  return na - nb || a.localeCompare(b);
});

const BASE_WEIGHT = 3.5, HOVER_WEIGHT = 6.5;

function popupHtml(p) {
  const dir = p.direction_id === '0' ? 'Direction 0' : 'Direction 1';
  return `<div class="pop-head">
      <span class="badge" style="background:${p.route_color};color:${p.route_text_color}">${p.route_short_name}</span>
      <span class="pop-name">${p.route_long_name}</span>
    </div>
    ${p.route_desc ? `<div class="pop-row">${p.route_desc}</div>` : ''}
    <div class="pop-row"><b>${dir}</b> → ${p.headsign}</div>
    <div class="pop-row">${p.trips.toLocaleString()} trips use this alignment, across every service pattern in the feed</div>`;
}

/* Each route gets a LayerGroup holding a white casing + the colored line,
   so routes read clearly where they overlap on the same street. */
const layers = new Map();
for (const [id, r] of routes) {
  const group = L.layerGroup();
  for (const f of r.features) {
    const latlngs = f.geometry.coordinates.map(c => [c[1], c[0]]);
    const p = f.properties;

    L.polyline(latlngs, {
      color: '#fff', weight: BASE_WEIGHT + 3, opacity: .85, interactive: false
    }).addTo(group);

    const line = L.polyline(latlngs, {
      color: p.route_color, weight: BASE_WEIGHT, opacity: .95, lineJoin: 'round', lineCap: 'round'
    }).addTo(group);

    line.bindPopup(() => popupHtml(p), { maxWidth: 300 });
    line.bindTooltip(`${p.route_short_name} — ${p.route_long_name}`, { sticky: true, className: 'rt-tip' });
    line.on('mouseover', () => { line.setStyle({ weight: HOVER_WEIGHT }); line.bringToFront(); });
    line.on('mouseout', () => line.setStyle({ weight: BASE_WEIGHT }));
  }
  layers.set(id, group);
}

const visible = new Set(order);
for (const id of order) layers.get(id).addTo(map);

const allBounds = L.latLngBounds([]);
for (const g of layers.values()) g.eachLayer(l => allBounds.extend(l.getBounds()));

/* Phone-width: show the map first, let the user pull the route list open.
   Tracks width until the user works the toggle themselves, so a page that
   loaded narrow doesn't stay collapsed after the window is widened. */
let userToggled = false;
function syncPanelToWidth() {
  if (userToggled) return;
  document.getElementById('panel').classList.toggle('collapsed', window.innerWidth <= 720);
}
syncPanelToWidth();

/* The panel is laid out beside the map, so the map's own box is the usable
   area and plain padding is correct. On narrow screens the panel instead
   floats over the map, which is why it starts collapsed there -- padding
   around it would leave almost no map to fit into. */
function fitAll() {
  map.fitBounds(allBounds, { padding: [20, 20] });
}
fitAll();

/* Leaflet doesn't watch its own container, and the first fit can land while
   the layout is still settling (embeds and preview panes size late). Re-fit on
   resize until the user takes over, then leave their view alone. Keying off
   real input events rather than Leaflet's zoomstart/dragstart avoids counting
   our own fitBounds calls as user intent. */
let userMoved = false;
const markMoved = () => { userMoved = true; };
for (const ev of ['pointerdown', 'wheel', 'dblclick', 'keydown']) {
  map.getContainer().addEventListener(ev, markMoved, { passive: true });
}

let resizeTimer;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    syncPanelToWidth();
    map.invalidateSize({ animate: false });
    if (!userMoved) fitAll();
  }, 120);
}
window.addEventListener('resize', onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe(document.getElementById('map'));

/* ---------------- route list ---------------- */
const listEl = document.getElementById('routes');
const rows = new Map();

for (const id of order) {
  const p = routes.get(id).meta;
  const row = document.createElement('div');
  row.className = 'route';
  row.innerHTML = `
    <input type="checkbox" checked aria-label="Toggle ${id}">
    <span class="badge" style="background:${p.route_color};color:${p.route_text_color}">${p.route_short_name}</span>
    <span class="name" title="${p.route_long_name}">${p.route_long_name}</span>
    <button class="zoom" title="Zoom to ${id}">zoom</button>`;

  const box = row.querySelector('input');
  box.addEventListener('change', () => setVisible(id, box.checked));

  // Clicking the row (but not the checkbox or zoom button) also toggles.
  row.addEventListener('click', e => {
    if (e.target === box || e.target.classList.contains('zoom')) return;
    setVisible(id, !visible.has(id));
  });

  row.querySelector('.zoom').addEventListener('click', e => {
    e.stopPropagation();
    if (!visible.has(id)) setVisible(id, true);
    const b = L.latLngBounds([]);
    layers.get(id).eachLayer(l => b.extend(l.getBounds()));
    map.fitBounds(b, { padding: [40, 40] });
  });

  listEl.appendChild(row);
  rows.set(id, row);
}

function setVisible(id, on) {
  const row = rows.get(id);
  if (on) { visible.add(id); layers.get(id).addTo(map); bringOverlaysToFront(); }
  else { visible.delete(id); map.removeLayer(layers.get(id)); }
  row.classList.toggle('off', !on);
  row.querySelector('input').checked = on;
  updateCount();
}

function updateCount() {
  document.getElementById('count').textContent = `${visible.size} / ${order.length} shown`;
}

/* ---------------- filter ---------------- */
const searchEl = document.getElementById('search');
function filtered() {
  return order.filter(id => rows.get(id).style.display !== 'none');
}
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  for (const id of order) {
    const p = routes.get(id).meta;
    const hay = `${p.route_short_name} ${p.route_long_name} ${p.route_desc}`.toLowerCase();
    rows.get(id).style.display = !q || hay.includes(q) ? '' : 'none';
  }
});

// Show all / Hide all act on whatever the filter is currently showing.
document.getElementById('all').addEventListener('click', () => filtered().forEach(id => setVisible(id, true)));
document.getElementById('none').addEventListener('click', () => filtered().forEach(id => setVisible(id, false)));
document.getElementById('reset').addEventListener('click', fitAll);

// No custom pane here either -- see the note above alertLayer for why.
const fleetLayer = L.layerGroup();

/* Taxi icon, not a plain dot -- L.divIcon renders as a real DOM element in
   Leaflet's markerPane, not the shared canvas the routes/alerts/cab-route
   layers use, so this can't reintroduce the pane-canvas click-blocking bug
   documented above (a <canvas>'s full bounding box swallows clicks; a small
   per-marker <div> only covers its own pixels) and needs no bringToFront()
   handling -- markerPane already paints above the canvas overlayPane by
   Leaflet's own default pane order. */
const TAXI_ICON = L.divIcon({
  className: 'taxi-icon',
  html: `<svg viewBox="0 0 16 30" width="10" height="18" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.5" y="2" width="13" height="26" rx="5" fill="#f3c300" stroke="#1c2530" stroke-width="1.3"/>
    <rect x="3.5" y="6" width="9" height="4.5" rx="1.2" fill="#1c2530" opacity=".82"/>
    <rect x="3.5" y="19" width="9" height="4.5" rx="1.2" fill="#1c2530" opacity=".82"/>
    <rect x="5.5" y=".5" width="5" height="2.6" rx="1" fill="#1c2530"/>
  </svg>`,
  iconSize: [10, 18],
  iconAnchor: [5, 9],
});

function drawFleet() {
  fleetLayer.clearLayers();
  for (const c of FLEET.cabs) {
    L.marker([c.lat, c.lon], { icon: TAXI_ICON })
      .bindTooltip(
        `simulated cab · ${c.zone_name}`,
        { sticky: true, className: 'rt-tip' }
      ).addTo(fleetLayer);
  }
}

const fleetToggle = document.getElementById('fleettoggle');
fleetToggle.addEventListener('change', () => {
  // Fleet is lowest-priority of the three overlays -- newly added, it would
  // otherwise land on top of alerts/cab-route by add-order alone if either
  // was already showing. bringOverlaysToFront() (defined below, once all
  // three layers exist) puts it back underneath them.
  if (fleetToggle.checked) { drawFleet(); fleetLayer.addTo(map); bringOverlaysToFront(); }
  else map.removeLayer(fleetLayer);
});

/* All vectors share one canvas renderer now (see the note above alertLayer),
   so z-order is pure add-order -- and re-adding a route via setVisible(true)
   (toggling a checkbox, "All", a filter match, "Show only alert routes")
   appends it to the END of that order, putting it back on top of alerts that
   were drawn earlier. bringToFront() exists on individual Path layers even
   under Canvas rendering (unlike L.LayerGroup, which has no such method) --
   called here, in fleet/cabRoute/alert priority so alerts land frontmost,
   every time a route is turned back on. */
function bringOverlaysToFront() {
  if (map.hasLayer(fleetLayer)) fleetLayer.eachLayer(l => l.bringToFront && l.bringToFront());
  if (map.hasLayer(cabRouteLayer)) cabRouteLayer.eachLayer(l => l.bringToFront && l.bringToFront());
  if (map.hasLayer(alertLayer)) alertLayer.eachLayer(l => l.bringToFront && l.bringToFront());
  demoAlertLayer.eachLayer(l => l.bringToFront && l.bringToFront());
}

// Tracks which stop's route is currently drawn, so a second click on the
// SAME stop's button hides it instead of just redrawing the same line.
// Reset to null anywhere cabRouteLayer gets cleared for a reason OTHER than
// this toggle (a budget/band change, Delay alerts turning off) -- otherwise
// the next click on that stop would think a route is showing when the layer
// was actually already emptied out from under it.
let currentCabRouteStopId = null;

function drawCabRoute(stopId) {
  const wasShowingThisStop = currentCabRouteStopId === stopId;
  cabRouteLayer.clearLayers();
  currentCabRouteStopId = null;
  if (wasShowingThisStop) return; // this click's job was only to hide it

  const c = cabByStop.get(stopId);
  if (!c || !c.route) return;

  const latlngs = c.route.geometry.map(p => [p[1], p[0]]);
  const line = L.polyline(latlngs, {
    color: '#1c2530', weight: 3, opacity: .8, dashArray: '1,7', lineCap: 'round',
  }).addTo(cabRouteLayer);

  const mid = latlngs[Math.floor(latlngs.length / 2)];
  L.tooltip({ permanent: true, direction: 'top', className: 'cabtip', offset: [0, -4] })
    .setLatLng(mid)
    .setContent(`${fmtMin(c.route.duration_s)} · ${(c.route.distance_m / 1609.34).toFixed(1)} mi
      · free-flow, no traffic`)
    .addTo(cabRouteLayer);

  const origin = latlngs[0];
  L.circleMarker(origin, {
    radius: 7, color: '#fff', weight: 2, fillColor: '#1c2530', fillOpacity: 1,
  }).bindTooltip(`simulated cab near ${c.nearest[0].zone_name}`, { direction: 'top' }).addTo(cabRouteLayer);

  currentCabRouteStopId = stopId;
}

let activeBands = new Set(A.bands.map(b => b.key));
let budgetIdx = A.budgets.length ? A.budgets.length - 1 : 0;

function bandOf(hour) {
  const b = A.bands.find(b => hour >= b.lo && hour <= b.hi);
  return b ? b.key : null;
}

function currentBudget() {
  return A.budgets[budgetIdx] || { pct: A.meta.max_budget };
}

function selectedAlerts() {
  const pct = currentBudget().pct;
  return A.alerts.filter(a => a[AI.RANK] <= pct && activeBands.has(bandOf(a[AI.HOUR])));
}

/* Shared between the real (filtered) alert markers and the standalone
   single-alert popup the live-alert demo opens, so the two never drift. */
function buildCabHtml(stopId) {
  const cab = cabByStop.get(stopId);
  if (!cab) return '';
  return `
    <hr style="border:0;border-top:1px solid #e6e9ee;margin:7px 0">
    <div class="cabsec">
      <div class="r" style="margin-bottom:3px"><b>Nearest simulated cabs</b></div>
      <div class="cabnote">synthetic positions · stock routing, no traffic weighting yet</div>
      <ul class="cablist">
        ${cab.nearest.map(c => `<li><span>near ${c.zone_name}${c.source === 'real-weighted' ? ' •' : ''}</span>
          <span class="t">${fmtMin(c.duration_s)} · ${(c.distance_m / 1609.34).toFixed(1)} mi</span></li>`).join('')}
      </ul>
      ${cab.nearest.some(c => c.source === 'real-weighted') ? '<div class="cabnote">• zone density informed by 2023 TLC pickups</div>' : ''}
      ${cab.route ? `<button class="mini cabbtn" onclick="drawCabRoute('${stopId}')">Show fastest route on map</button>` : ''}
    </div>`;
}

function drawAlerts() {
  alertLayer.clearLayers();
  // A budget/band change can remove the very marker whose popup drew this
  // route, so any drawn cab route is stale the moment the selection changes.
  cabRouteLayer.clearLayers();
  currentCabRouteStopId = null;
  const sel = selectedAlerts();

  const byStop = new Map();
  for (const a of sel) {
    if (!byStop.has(a[AI.STOP])) byStop.set(a[AI.STOP], []);
    byStop.get(a[AI.STOP]).push(a);
  }

  // Area scales with count, so a stop that fires 40 times does not read as
  // forty times the emphasis of one that fires once.
  const maxN = Math.max(1, ...[...byStop.values()].map(v => v.length));
  for (const [idx, list] of byStop) {
    const s = A.stops[idx];
    const hits = list.reduce((n, a) => n + a[AI.Y], 0);
    const radius = 4 + 10 * Math.sqrt(list.length / maxN);

    const marker = L.circleMarker([s.lat, s.lon], {
      radius,
      color: '#fff', weight: 1.5,
      fillColor: ROUTE_COLOR[s.route] || '#666', fillOpacity: .85,
    });

    const cabHtml = buildCabHtml(s.id);

    marker.bindPopup(`<div class="alertpop">
      <div><span class="badge" style="background:${ROUTE_COLOR[s.route]};color:#fff">${s.route}</span>
        <b>${s.name}</b></div>
      <div class="r">${s.zone}</div>
      <div class="r"><b>${list.length}</b> alert${list.length > 1 ? 's' : ''} at this budget,
        <b>${hits}</b> followed by a real delay
        (${(hits / list.length * 100).toFixed(0)}%)</div>
      ${cabHtml}</div>`, { maxWidth: 320 });

    marker.bindTooltip(
      `${s.route} — ${s.name}: ${list.length} alert${list.length > 1 ? 's' : ''}, ${hits} correct`,
      { sticky: true, className: 'rt-tip' }
    );
    marker.addTo(alertLayer);
  }

  const hits = sel.reduce((n, a) => n + a[AI.Y], 0);
  const prec = sel.length ? hits / sel.length : 0;
  const lift = A.meta.base_rate ? prec / A.meta.base_rate : 0;
  const allBands = activeBands.size === A.bands.length;

  document.getElementById('alertsummary').innerHTML = sel.length
    ? `${sel.length.toLocaleString()} alerts at ${byStop.size} stops ·
       <b>${(prec * 100).toFixed(1)}% followed by a real delay</b> ·
       <b>${lift.toFixed(1)}×</b> better than random`
    : 'No alerts in the selected hours.';

  const b = currentBudget();
  document.getElementById('budgetval').textContent = `top ${b.pct}%`;
  // The budget figures always describe the whole day; the summary above them
  // describes whatever bands are selected. Say so when the two differ, or the
  // two alert counts on screen look like a contradiction.
  document.getElementById('budgetnote').innerHTML = b.alerts
    ? `${allBands ? '' : 'Across all hours: '}≈${b.per_month.toLocaleString()} alerts/month
       over ${A.meta.folds.length} months · catches
       ${(b.recall * 100).toFixed(1)}% of all delays`
    : '';
}

/* Route key. Marker size means alert count, so it is spelled out too --
   nothing on this layer is identifiable by colour alone. */
document.getElementById('alertkey').innerHTML =
  A.meta.routes.map(r => `<span><i style="background:${ROUTE_COLOR[r] || '#666'}"></i>${r}</span>`).join('')
  + '<span style="margin-left:auto">circle size = alerts fired</span>';

document.getElementById('alerttag').textContent =
  `${A.meta.folds.length}-fold 2024 backtest`;

/* budget slider */
const budgetEl = document.getElementById('budget');
budgetEl.max = String(Math.max(A.budgets.length - 1, 0));
budgetEl.value = String(budgetIdx);
budgetEl.addEventListener('input', () => {
  budgetIdx = +budgetEl.value;
  drawAlerts();
});

/* band chips */
const bandsEl = document.getElementById('bands');
for (const b of A.bands) {
  const el = document.createElement('button');
  el.className = 'chip';
  el.type = 'button';
  el.setAttribute('aria-pressed', 'true');
  el.textContent = b.label;
  el.addEventListener('click', () => {
    if (activeBands.has(b.key)) activeBands.delete(b.key);
    else activeBands.add(b.key);
    // Never leave every band off -- an empty map looks like a broken layer.
    if (!activeBands.size) { activeBands = new Set(A.bands.map(x => x.key)); }
    for (const c of bandsEl.children) {
      c.setAttribute('aria-pressed', activeBands.has(A.bands[[...bandsEl.children].indexOf(c)].key));
    }
    drawAlerts();
  });
  bandsEl.appendChild(el);
}

const alertsBox = document.getElementById('alerts');
const alertToggle = document.getElementById('alerttoggle');
alertsBox.classList.add('off');
alertToggle.addEventListener('change', () => {
  alertsBox.classList.toggle('off', !alertToggle.checked);
  if (alertToggle.checked) { drawAlerts(); alertLayer.addTo(map); }
  else { map.removeLayer(alertLayer); cabRouteLayer.clearLayers(); currentCabRouteStopId = null; demoAlertLayer.clearLayers(); currentDemoMarker = null; }
});

document.getElementById('isolate').addEventListener('click', () => {
  // Pure route-visibility filter -- deliberately does not touch the Delay
  // alerts checkbox either way, so it works standalone regardless of whether
  // the alert-marker layer is on, off, or never touched at all.
  const keep = new Set(A.meta.routes);
  for (const id of order) setVisible(id, keep.has(id));
  if (A.stops.length) {
    map.fitBounds(L.latLngBounds(A.stops.map(s => [s.lat, s.lon])), { padding: [40, 40] });
  }
});

drawAlerts();

/* ---------------- live-alert demo trigger ----------------
   For presenting live: replays a REAL alert from the 2024 backtest as a push
   notification, on cue (button or the "L" key), rather than waiting for the
   presenter to click through the panel to find one.

   One honesty rule this has to follow, given everything else on this map is
   careful to never overstate what the model actually does:

   The picked alert is real data, at random from the highest-probability
   alerts in A.alerts -- never fabricated, and never filtered to "delay
   actually occurred" cases. Selecting only hits would quietly misrepresent
   the model's real precision (8-27% depending on budget, see the budget
   slider above) as something close to 100% just by cherry-picking which
   examples get shown live. That would undercut the one thing this whole map
   has been careful about everywhere else.

   Neither the toast nor the full popup reached by clicking through shows the
   historical outcome (hit/miss) at all -- both display only the
   forward-looking risk percentage, by request. (An earlier version showed
   the outcome in the full popup only, reasoning that a live system wouldn't
   know it yet either but the popup could since it's explicit about being a
   backtest -- that distinction was cut in favor of one consistent "potential
   delay" framing everywhere.) The rule above is now the only thing standing
   between this feature and misleadingly looking more accurate than the model
   actually is, which is why it still matters that the pool isn't
   hit-filtered even though the UI never shows which alerts hit. */
const DEMO_POOL = A.alerts.length
  ? A.alerts.slice().sort((a, b) => b[AI.PCAL] - a[AI.PCAL]).slice(0, 60)
  : [];
let lastDemoIdx = -1;

function pickDemoAlert() {
  if (!DEMO_POOL.length) return null;
  let i;
  do { i = Math.floor(Math.random() * DEMO_POOL.length); }
  while (DEMO_POOL.length > 1 && i === lastDemoIdx);
  lastDemoIdx = i;
  return DEMO_POOL[i];
}

function flyToAlert(record) {
  const s = A.stops[record[AI.STOP]];

  // Deliberately does NOT touch the Delay alerts checkbox at all -- not even
  // to check it. It doesn't need to: demoAlertLayer is attached to the map
  // unconditionally at setup, so this marker shows regardless of that
  // checkbox's state. Checking it used to seem harmless ("it's alert-related,
  // the panel should say so"), but the checkbox's own change handler calls
  // drawAlerts() using whatever budget/bands are CURRENTLY set -- and those
  // default to the widest setting on a fresh page (budgetIdx starts at
  // A.budgets.length - 1, activeBands starts as every band) -- so on the most
  // common actual path, a presenter's very first click, it silently redrew
  // the entire real alert layer anyway, the same flooding this was meant to
  // fix in the first place.
  demoAlertLayer.clearLayers();
  // Captured in a local, not read back off the shared currentDemoMarker at
  // callback time: a second "View on map" click, or Delay alerts being
  // switched off, can reassign or null that variable before this 850ms delay
  // is up, and the stale closure would then call openPopup() on the wrong
  // marker -- or on null, throwing outright. This marker is what THIS call
  // created, full stop, regardless of what happens to the shared variable
  // in the meantime.
  const marker = L.circleMarker([s.lat, s.lon], {
    radius: 9, color: '#fff', weight: 2,
    fillColor: ROUTE_COLOR[s.route] || '#666', fillOpacity: .9,
  });
  marker.bindPopup(`<div class="alertpop">
    <div><span class="badge" style="background:${ROUTE_COLOR[s.route]};color:#fff">${s.route}</span>
      <b>${s.name}</b></div>
    <div class="r">${s.zone}</div>
    <div class="r">${(record[AI.PCAL] * 100).toFixed(1)}% chance of delay</div>
    ${buildCabHtml(s.id)}</div>`, { maxWidth: 320 });
  marker.addTo(demoAlertLayer);
  currentDemoMarker = marker;
  bringOverlaysToFront();

  map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 14), { duration: 0.8 });
  setTimeout(() => { if (map.hasLayer(marker)) marker.openPopup(); }, 850);
}

let currentToast = null;

// No auto-dismiss timer -- during a live demo, a toast disappearing on its
// own while the presenter is mid-sentence (or just not looking at it) is
// worse than one that overstays. It only ever closes on an explicit action:
// the close button, "View on map", or the reset-demo button. Shared (rather
// than a closure-local function per toast) so resetDemo() can also dismiss
// whatever toast happens to be up without reaching into showLiveToast.
function dismissToast() {
  const el = currentToast;
  if (!el) return;
  el.classList.remove('show');
  setTimeout(() => { el.remove(); if (currentToast === el) currentToast = null; }, 260);
}

function showLiveToast(record) {
  const s = A.stops[record[AI.STOP]];
  if (currentToast) currentToast.remove();

  const el = document.createElement('div');
  el.className = 'livetoast';
  el.innerHTML = `
    <div class="lt-top">
      <span class="lt-dot"></span>
      <span class="lt-label">Live alert <span class="tag">simulated</span></span>
      <button class="lt-close" aria-label="Dismiss">&times;</button>
    </div>
    <div class="lt-body">
      <span class="badge" style="background:${ROUTE_COLOR[s.route]};color:#fff">${s.route}</span>
      <b>${s.name}</b>
      <div class="lt-zone">${s.zone}</div>
      <div class="lt-risk">${(record[AI.PCAL] * 100).toFixed(1)}% risk of delay, next hour</div>
    </div>
    <button class="mini lt-view">View on map</button>`;
  document.body.appendChild(el);
  currentToast = el;
  requestAnimationFrame(() => el.classList.add('show'));

  el.querySelector('.lt-close').addEventListener('click', dismissToast);
  el.querySelector('.lt-view').addEventListener('click', () => { dismissToast(); flyToAlert(record); });
}

function triggerLiveDemo() {
  const record = pickDemoAlert();
  if (record) showLiveToast(record);
}

const simulateBtn = document.getElementById('simulatelive');
if (DEMO_POOL.length) {
  simulateBtn.addEventListener('click', triggerLiveDemo);
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (e.key.toLowerCase() === 'l' && tag !== 'INPUT' && tag !== 'TEXTAREA') triggerLiveDemo();
  });
} else {
  simulateBtn.disabled = true;
  simulateBtn.title = 'No alert data in this build';
}

/* ---------------- reset demo ----------------
   A presenter control for repeated run-throughs: one click puts every
   toggle, slider, filter, and overlay back to its fresh-page-load state
   without an actual reload (which would also lose the current map size/
   tile load). Drives the real toggles/handlers rather than touching layers
   directly, so this can never drift out of sync with what those handlers
   already do on/off. */
function resetDemo() {
  searchEl.value = '';
  searchEl.dispatchEvent(new Event('input'));
  filtered().forEach(id => setVisible(id, true));

  if (alertToggle.checked) { alertToggle.checked = false; alertToggle.dispatchEvent(new Event('change')); }
  if (fleetToggle.checked) { fleetToggle.checked = false; fleetToggle.dispatchEvent(new Event('change')); }

  budgetIdx = A.budgets.length ? A.budgets.length - 1 : 0;
  budgetEl.value = String(budgetIdx);
  activeBands = new Set(A.bands.map(b => b.key));
  for (const c of bandsEl.children) c.setAttribute('aria-pressed', 'true');
  // drawAlerts() also rebuilds alertLayer's markers (harmless -- it's only
  // re-added to the map if alerts get switched back on) but its real job
  // here is refreshing #budgetval/#budgetnote/#alertsummary, which nothing
  // else touches: those only update from drawAlerts() itself, so without
  // this call the slider snaps back to its default position while the "top
  // X%" text next to it keeps showing whatever was selected before reset.
  drawAlerts();

  // Alerts-off already clears these via alertToggle's own change handler,
  // but only if alerts were on to begin with -- the demo marker/cab-route
  // can exist independently of that checkbox, so clear them unconditionally.
  cabRouteLayer.clearLayers();
  currentCabRouteStopId = null;
  demoAlertLayer.clearLayers();
  currentDemoMarker = null;
  dismissToast();

  map.closePopup();

  const panelEl = document.getElementById('panel');
  if (panelEl.classList.contains('collapsed')) {
    userToggled = true;
    panelEl.classList.remove('collapsed');
    setTimeout(() => map.invalidateSize(), 240);
  }

  fitAll();
}
document.getElementById('resetdemo').addEventListener('click', resetDemo);

/* ---------------- panel toggle ---------------- */
document.getElementById('toggle').addEventListener('click', () => {
  userToggled = true;
  document.getElementById('panel').classList.toggle('collapsed');
  setTimeout(() => map.invalidateSize(), 240);
});

updateCount();
</script>
</body>
</html>
